<VirtualHost *:80>
    ServerName 5k.ag
    ServerAlias www.5k.ag
    DocumentRoot "/www/wwwroot/5k.ag"
    ErrorLog "/www/wwwlogs/5k.ag-error_log"
    CustomLog "/www/wwwlogs/5k.ag-access_log" combined

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4010/api/ nocanon
    ProxyPassReverse /api/ http://127.0.0.1:4010/api/
    ProxyPass /media/ http://127.0.0.1:4010/media/ nocanon
    ProxyPassReverse /media/ http://127.0.0.1:4010/media/

    <Directory "/www/wwwroot/5k.ag">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>
    <Directory "/www/wwwroot/5k.ag/admin">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /admin/index.html
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName 5k.ag
    ServerAlias www.5k.ag
    DocumentRoot "/www/wwwroot/5k.ag"
    ErrorLog "/www/wwwlogs/5k.ag-error_log"
    CustomLog "/www/wwwlogs/5k.ag-access_log" combined

    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/5k.ag/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/5k.ag/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4010/api/ nocanon
    ProxyPassReverse /api/ http://127.0.0.1:4010/api/
    ProxyPass /media/ http://127.0.0.1:4010/media/ nocanon
    ProxyPassReverse /media/ http://127.0.0.1:4010/media/

    <Directory "/www/wwwroot/5k.ag">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>
    <Directory "/www/wwwroot/5k.ag/admin">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /admin/index.html
    </Directory>
</VirtualHost>
