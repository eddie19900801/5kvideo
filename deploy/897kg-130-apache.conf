<VirtualHost 154.91.19.108:80>
    ServerName 897kg.cc
    ServerAlias www.897kg.cc
    Redirect permanent / https://897kg.cc/
</VirtualHost>

<VirtualHost 154.91.19.108:443>
    ServerName 897kg.cc
    ServerAlias www.897kg.cc
    DocumentRoot "/opt/5k-middle-platform/edge/www/wwwroot/897kg.cc"

    SSLEngine On
    SSLCertificateFile "/opt/5k-middle-platform/edge/www/server/panel/vhost/cert/897kg.cc/fullchain.pem"
    SSLCertificateKeyFile "/opt/5k-middle-platform/edge/www/server/panel/vhost/cert/897kg.cc/privkey.pem"
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    <Location /vdo/>
        RequestHeader set X-Forwarded-Prefix "/vdo"
    </Location>

    ProxyPass        /vdo/api/   http://127.0.0.1:4010/api/ nocanon timeout=3600
    ProxyPassReverse /vdo/api/   http://127.0.0.1:4010/api/
    ProxyPass        /vdo/media/ http://127.0.0.1:4010/media/ nocanon timeout=3600
    ProxyPassReverse /vdo/media/ http://127.0.0.1:4010/media/

    ProxyPass        /dhang/api/ http://127.0.0.1:4020/api/ nocanon
    ProxyPassReverse /dhang/api/ http://127.0.0.1:4020/api/
    ProxyPass        /api/       http://127.0.0.1:4020/api/ nocanon
    ProxyPassReverse /api/       http://127.0.0.1:4020/api/

    ProxyPass        /ads/api/ http://127.0.0.1:4100/ nocanon
    ProxyPassReverse /ads/api/ http://127.0.0.1:4100/

    ProxyPass        /ne/api/ http://127.0.0.1:4310/ne/api/ nocanon
    ProxyPassReverse /ne/api/ http://127.0.0.1:4310/ne/api/
    ProxyPass        /h5-api/ http://127.0.0.1:4310/api/ nocanon
    ProxyPassReverse /h5-api/ http://127.0.0.1:4310/api/
    ProxyPass        /h5-uploads/ http://127.0.0.1:4310/uploads/ nocanon
    ProxyPassReverse /h5-uploads/ http://127.0.0.1:4310/uploads/

    RedirectMatch 301 ^/vdo/admin$ /vdo/admin/
    Alias /vdo/admin/ "/opt/5k-middle-platform/admin/5kvideo-admin-current/"
    <Directory "/opt/5k-middle-platform/admin/5kvideo-admin-current">
        Require all granted
        Options -Indexes
        FallbackResource /vdo/admin/index.html
    </Directory>

    RedirectMatch 301 ^/dhang/admin$ /dhang/admin/
    Alias /dhang/admin/ "/opt/5k-middle-platform/admin/ikumep.cn-current-admin/"
    <Directory "/opt/5k-middle-platform/admin/ikumep.cn-current-admin">
        Require all granted
        Options -Indexes
        FallbackResource /dhang/admin/index.html
    </Directory>
    Alias /dhang/site-data/ "/opt/5k-middle-platform/navigation/published-site/"
    <Directory "/opt/5k-middle-platform/navigation/published-site">
        Require all granted
        Options -Indexes
    </Directory>
    Alias /dhang/ "/opt/5k-middle-platform/admin/ikumep.cn-current-admin/"
    <Directory "/opt/5k-middle-platform/admin/ikumep.cn-current-admin">
        Require all granted
        Options -Indexes
        FallbackResource /dhang/index.html
    </Directory>

    Alias /ads/ "/opt/5k-middle-platform/admin/5k-ad-platform-current/"
    <Directory "/opt/5k-middle-platform/admin/5k-ad-platform-current">
        Require all granted
        Options -Indexes
        FallbackResource /ads/index.html
    </Directory>

    RedirectMatch 301 ^/ne/admin$ /ne/admin/
    Alias /ne/admin/ "/opt/5k-middle-platform/admin/5knews-admin-current/"
    <Directory "/opt/5k-middle-platform/admin/5knews-admin-current">
        Require all granted
        Options -Indexes
        FallbackResource /ne/admin/index.html
    </Directory>

    Alias /tv/ "/opt/5k-middle-platform/edge/www/wwwroot/5ktv-download/"
    <Directory "/opt/5k-middle-platform/edge/www/wwwroot/5ktv-download">
        Require all granted
        Options -Indexes
    </Directory>

    Alias /app/ "/opt/5k-middle-platform/edge/www/wwwroot/5kvideo-app-download/"
    <Directory "/opt/5k-middle-platform/edge/www/wwwroot/5kvideo-app-download">
        Require all granted
        Options -Indexes
    </Directory>

    <Directory "/opt/5k-middle-platform/edge/www/wwwroot/897kg.cc">
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    ErrorLog "/www/wwwlogs/897kg-130-error.log"
    CustomLog "/www/wwwlogs/897kg-130-access.log" combined
</VirtualHost>
