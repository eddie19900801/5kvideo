location = /vdo/admin { return 301 /vdo/admin/; }

location ^~ /vdo/admin/assets/ {
    alias /www/wwwroot/5kvideo-admin-current/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}

location = /vdo/admin/index.html {
    alias /www/wwwroot/5kvideo-admin-current/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /vdo/admin/ {
    try_files /__5kvideo_admin_not_a_file__ /vdo/admin/index.html;
}

location ^~ /vdo/api/ {
    client_max_body_size 8g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host 897kg.cc;
    proxy_set_header Origin "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /vdo;
    rewrite ^/vdo/api/(.*)$ /api/$1 break;
    sub_filter_types application/json application/vnd.apple.mpegurl;
    sub_filter_once off;
    sub_filter 'https://897kg.cc/api/' 'https://897kg.cc/vdo/api/';
    sub_filter 'https://897kg.cc/media/' 'https://897kg.cc/vdo/media/';
    sub_filter 'https://5k.ag/api/' 'https://897kg.cc/vdo/api/';
    sub_filter 'https://5k.ag/media/' 'https://897kg.cc/vdo/media/';
    proxy_pass http://154.91.16.130;
}

location ^~ /vdo/media/ {
    proxy_set_header Host 897kg.cc;
    proxy_set_header Origin "";
    rewrite ^/vdo/media/(.*)$ /media/$1 break;
    proxy_pass http://154.91.16.130;
}
