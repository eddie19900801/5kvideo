server {
    listen 80;
    listen [::]:80;
    server_name 897kg.cc www.897kg.cc;
    root /www/wwwroot/ikumep.cn-current-web;
    location ^~ /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 156.224.147.194:443 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 897kg.cc www.897kg.cc;
    root /www/wwwroot/ikumep.cn-current-web;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/897kg.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/897kg.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /www/server/panel/vhost/nginx/897kg-vdo.locations.inc;

    location ~ ^/(?:dhang/)?api/v1/assets/.+\.enc$ {
        rewrite ^/(?:dhang/)?api/(.*)$ /api/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        proxy_pass http://127.0.0.1:4020;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'https://ikumep.cn/dhang/api/v1/assets/' 'https://897kg.cc/dhang/api/v1/assets/';
        proxy_pass http://127.0.0.1:4020/api/;
    }

    location /dhang/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'https://ikumep.cn/dhang/api/v1/assets/' 'https://897kg.cc/dhang/api/v1/assets/';
        proxy_pass http://127.0.0.1:4020/api/;
    }

    location ^~ /dhang/assets/ {
        alias /www/wwwroot/ikumep.cn-current-admin/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location = /dhang/favicon.svg { alias /www/wwwroot/ikumep.cn-current-admin/favicon.svg; }
    location = /dhang/index.html {
        alias /www/wwwroot/ikumep.cn-current-admin/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location /dhang/ { try_files /__admin_route_not_a_file__ /dhang/index.html; }

    location = /ads { return 301 /ads/; }
    location ^~ /ads/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4100/;
    }
    location ^~ /ads/assets/ {
        alias /www/wwwroot/5k-ad-platform-current/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location = /ads/index.html {
        alias /www/wwwroot/5k-ad-platform-current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /ads/ { try_files /__ads_route_not_a_file__ /ads/index.html; }

    location ^~ /ne/api/ {
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4310/ne/api/;
    }
    location ^~ /ne/admin/assets/ {
        alias /www/wwwroot/5knews-admin-current/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location = /ne/admin/index.html {
        alias /www/wwwroot/5knews-admin-current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /ne/admin { return 301 /ne/admin/; }
    location /ne/admin/ { try_files /__5knews_admin_not_a_file__ /ne/admin/index.html; }

    location / { try_files $uri $uri/ /index.html; }
    access_log /www/wwwlogs/897kg.cc.log;
    error_log /www/wwwlogs/897kg.cc.error.log;
}
