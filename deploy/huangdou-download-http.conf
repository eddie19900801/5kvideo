server {
    listen 80;
    listen [::]:80;
    server_name huangdou.download.wflhc.cn;
    root /www/wwwroot/5knews-web-current;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
