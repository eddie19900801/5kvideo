server {
    listen 156.224.147.194:443 ssl;
    listen 156.224.147.220:443 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ppfree.download.wflhc.cn 17tq.download.wflhc.cn 91xueyuan.download.wflhc.cn;
    root /www/wwwroot/5knews-web-current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/wflhc-download/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wflhc-download/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /vdo-api/ {
        proxy_set_header Host 897kg.cc;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/vdo-api/(.*)$ /vdo/api/$1 break;
        proxy_ssl_server_name on;
        proxy_ssl_name 897kg.cc;
        proxy_pass https://154.91.19.108;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/wflhc-download.log;
    error_log /www/wwwlogs/wflhc-download.error.log;
}
