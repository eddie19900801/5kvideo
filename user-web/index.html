  <style>
    #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#151414;color:#faf9f9;font-family:Inter,system-ui,sans-serif;opacity:1;transition:opacity .35s ease;transform:translateZ(0)}
    #boot-splash.boot-splash-exit{opacity:0;pointer-events:none}
    #boot-splash-content{display:flex;flex-direction:column;align-items:center;gap:18px}
    #boot-splash img{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:0 18px 45px rgba(225,45,55,.22)}
    #boot-splash strong{font-size:28px;letter-spacing:.08em}
    #boot-splash span{font-size:14px;color:#858181}
    #boot-splash-bar{width:128px;height:2px;margin-top:4px;overflow:hidden;border-radius:99px;background:#292727}
    #boot-splash-bar::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#e33b45;animation:boot-loading 1.1s ease-in-out infinite}
    @keyframes boot-loading{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
  </style>
  </head>
  <body>
    <div id="boot-splash" aria-label="5K视频正在加载">
      <div id="boot-splash-content">
        <img src="/icons/5k-video-app-icon-192.png" alt="5K视频" />

        <span>永久域名：5k.ag</span>
        <div id="boot-splash-bar"></div>

    </div>
